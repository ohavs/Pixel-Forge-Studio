name: Art preview

# Renders sample generator output (faces + widgets) with Robolectric native graphics and uploads
# the PNGs, so the art can be reviewed without a phone.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/ohav/pixelforge/forge/**'
      - 'app/src/test/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*ArtPreviewTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art
          path: app/build/art
      - name: Publish to art-preview branch
        if: always()
        run: |
          cd app/build/art
          git init -q -b art-preview
          git config user.name "art-preview"; git config user.email "art-preview@users.noreply.github.com"
          git add -A && git commit -qm "Art preview for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" art-preview

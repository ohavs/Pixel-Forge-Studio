name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \r\n' | base64 -d > release.jks
          echo "KSPW=$(echo '${{ secrets.KEYSTORE_PASSWORD }}' | tr -d ' \r\n')" >> $GITHUB_ENV
          echo "::notice::jks $(sha256sum release.jks | cut -c1-12)"

      - name: Build signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ env.KSPW }}
          KEY_ALIAS: pixelforge
          KEY_PASSWORD: ${{ env.KSPW }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease 2>&1 | tee build.log || { grep -E '^e: |error:|What went wrong|invalid:' -A6 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk pixel-forge.apk
          cp wear/build/outputs/apk/release/wear-release.apk pixel-forge-wear.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" pixel-forge.apk pixel-forge-wear.apk \
            --title "Pixel Forge 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
